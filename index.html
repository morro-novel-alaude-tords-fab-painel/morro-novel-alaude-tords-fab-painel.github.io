const TZ_BR="America/Sao_Paulo";
function dBR(v){if(!v)return"";const s=String(v).trim();
 /* ja esta em dd/mm/aaaa? devolve como veio */
 if(/^\d{2}\/\d{2}\/\d{4}/.test(s))return s.slice(0,10);
 const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
 if(m)return m[3]+"/"+m[2]+"/"+m[1];   /* data pura: sem fuso, sem deslocar o dia */
 const d=new Date(s);if(isNaN(d))return s;
 return d.toLocaleDateString("pt-BR",{timeZone:TZ_BR,day:"2-digit",month:"2-digit",year:"numeric"});}
function dhBR(v){if(!v)return"";const s=String(v).trim();
 const d=new Date(s.includes("T")||s.includes(" ")?s.replace(" ","T"):s);
 if(isNaN(d))return dBR(s);
 return d.toLocaleString("pt-BR",{timeZone:TZ_BR,day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).replace(",","");}
function hojeBR(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ_BR,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());return new Date(p+"T00:00:00");}
function fmtISO(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function diasDesde(d){if(!d)return 0;const t=new Date(String(d).slice(0,10)+"T00:00:00");if(isNaN(t))return 0;
 return Math.round((hojeBR()-t)/864e5);}

 let it=base.filter(p=>{
  const papeis=(p.papeis||[]).join(', ');

  if(q&&!((p.nome+' '+papeis+' '+(p.obs||'')).toLowerCase().includes(q)))return false;

 const toks=t=>sa(t).split(' ').filter(w=>w&&!['jr','filho','neto','de','da','do','dos','das','e'].includes(w));
 const listaTok=ativos.map(n=>toks(n));
 const bate=v=>{const t=toks(v);if(!t.length)return true;
  const pri=t[0],ult=t[t.length-1];
  return listaTok.some(l=>l.includes(pri)&&(l.includes(ult)||t.length===1));};
 const cargaDe=p=>{const pn=toks(p.nome);if(!pn.length)return 0;return prod.filter(o=>emProducao(o)&&['resp_estudio','resp_copi','resp_revisao','resp_capista','resp_design'].some(k=>{const t=toks(o[k]||'');return t.length&&pn.includes(t[0])&&pn.includes(t[t.length-1]);})).length;};
 const fora=[];
 prod.forEach(p=>['resp_estudio','resp_copi','resp_revisao','resp_capista','resp_design'].forEach(k=>{
  const v=(p[k]||'').trim();
  if(v&&!bate(v)&&!fora.some(f=>f.quem===v))fora.push({quem:v,obra:p.titulo});}));
 const inativos=prestadores.filter(p=>p.ativo===false).length;

 h+='<div class="kpis">'+[[prestAtivos().length,'No time'],

   [prestAtivos().filter(p=>(p.papeis||[]).includes('Diagramação')||(p.papeis||[]).includes('Capa')).length,'Design'],

   [inativos,'Fora do time']]
   .map(k=>'<div class="kpi"><div class="n">'+k[0]+'</div><div class="l">'+k[1]+'</div></div>').join('')+'</div>';
 if(fora.length)h+='<div style="border-left:3px solid #C21F4A;border:1px solid var(--line);border-radius:10px;padding:11px 15px;margin:0 2px 12px">'

 h+='<div class="controls"><button class="chip" aria-pressed="'+(fPr.papel==='all')+'" data-pr="all">Toda etapa</button>'

  +'<span style="width:10px"></span>'

 h+='<div style="font-family:var(--util);font-size:12px;color:var(--muted);margin:0 2px 8px">'+it.length+' pessoas'+(prestEditavel?' · clique numa linha para editar':'')+'</div>';
 if(!it.length)return h+'<div class="empty">'+(fPr.fora?'Ninguém fora do time.':'Nada aqui com esse filtro.')+'</div>';
 const grpEst=['Estúdio','Tradução','Diagramação','Capa'];const grpTxt=['Copidesque','Revisão','Leitura crítica','EPUB'];
 const inG=(p,g)=>(p.papeis||[]).some(x=>g.includes(x));
 const RLBL={resp_estudio:'Estúdio',resp_copi:'Copi',resp_revisao:'Revisão',resp_capista:'Capa',resp_design:'Design'};
 const obrasDe=p=>{const pn=toks(p.nome);if(!pn.length)return [];const out=[];prod.forEach(o=>{if(!emProducao(o))return;Object.keys(RLBL).forEach(k=>{const t=toks(o[k]||'');if(t.length&&pn.includes(t[0])&&pn.includes(t[t.length-1]))out.push({t:o.titulo,r:RLBL[k],c:cfg(o.selo).c});});});return out;};
 const rowP=p=>{const obras=obrasDe(p);const carga=obras.length;const alto=carga>=3;
   const lista=carga?obras.map(o=>'<span class="dp" style="font-size:9px;padding:1px 6px;margin:0 3px 3px 0;display:inline-block;background:'+o.c+';color:#fff;border:none">'+esc(o.t)+' · '+o.r+'</span>').join(''):'<span style="color:var(--muted)">—</span>';

   +'<td class="util" style="font-size:11px;vertical-align:top">'+((p.canais||'').includes('+')?'<span class="pz ok">os dois</span>':esc((p.canais||'')==='estudios'?'estúdios':((p.canais||'')==='copi-revisao'?'copi e revisão':'—')))+'</td>'
   +'<td class="util" style="font-size:11px;max-width:360px;vertical-align:top">'+lista+'</td></tr>';};
 const secTab=(titulo,lista,cor)=>{if(!lista.length)return '';
   return '<div class="selogroup"><div class="selohead" data-collapse="prest:'+titulo+'" style="background:'+cor+';cursor:pointer"><span class="sn">'+titulo+'</span><span class="cnt">'+lista.length+' pessoa'+(lista.length>1?'s':'')+' <span style="margin-left:6px;display:inline-block;transform:rotate('+(collapsed['prest:'+titulo]?'-90deg':'0deg')+')">▾</span></span></div>'
    +(collapsed['prest:'+titulo]?'':'<div style="overflow-x:auto"><table><thead><tr><th>Nome</th><th>Etapas que faz</th><th>Canais</th><th>Obras ativas (o que faz em cada)</th></tr></thead><tbody>'+lista.map(rowP).join('')+'</tbody></table></div>')+'</div>';};
 const estList=it.filter(p=>inG(p,grpEst));const txtList=it.filter(p=>inG(p,grpTxt));const semG=it.filter(p=>!inG(p,grpEst)&&!inG(p,grpTxt));

 h+=secTab('Estúdio / Design',estList,'#3A3340');
 h+=secTab('Copidesque / Revisão',txtList,'#2E5A3E');
 if(semG.length)h+=secTab('Sem etapa definida',semG,'#5a5a5a');
 return h;
}

const MAXIMG=1600*1024;
function reduzImg(dataURL, ok){
 const im=new Image();
 im.onload=()=>{const MAXLADO=3000;let w=im.width,h=im.height;
  if(w>MAXLADO||h>MAXLADO){const k=Math.min(MAXLADO/w,MAXLADO/h);w=Math.round(w*k);h=Math.round(h*k);}
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.imageSmoothingEnabled=true;cx.imageSmoothingQuality="high";cx.drawImage(im,0,0,w,h);
  let q=0.85,out=cv.toDataURL("image/jpeg",q);
  while(out.length>MAXIMG&&q>0.45){q-=0.07;out=cv.toDataURL("image/jpeg",q);}
  if(out.length>MAXIMG){toast("Essa imagem continua grande demais depois de reduzida. Use um arquivo menor.","err");return;}
  ok(out,w,h);};
 im.onerror=()=>toast("Não consegui abrir essa imagem.","err");
 im.src=dataURL;
}

let _pdfjsLoading=null;
function ensurePdfJs(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(_pdfjsLoading)return _pdfjsLoading;
 _pdfjsLoading=new Promise((res,rej)=>{
  const s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  s.onload=()=>{try{if(window.pdfjsLib&&window.pdfjsLib.GlobalWorkerOptions)window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";res(window.pdfjsLib);}catch(e){rej(e);}};
  s.onerror=()=>{_pdfjsLoading=null;rej(new Error("Não consegui carregar o conversor de PDF (sem internet?)."));};
  document.head.appendChild(s);
 });
 return _pdfjsLoading;

 toast("Convertendo PDF em imagem…");
 ensurePdfJs().then(pdfjsLib=>{
  const rd=new FileReader();
  rd.onload=()=>{
   let data;try{data=new Uint8Array(rd.result);}catch(e){toast("Não consegui ler esse PDF.","err");return;}
   pdfjsLib.getDocument({data:data}).promise.then(pdf=>pdf.getPage(1).then(page=>{
    const vp1=page.getViewport({scale:1});
    const alvo=3000,maior=Math.max(vp1.width,vp1.height)||1;
    let scale=alvo/maior;if(!isFinite(scale)||scale<=0)scale=1;if(scale>5)scale=5;
    const vp=page.getViewport({scale:scale});
    const cv=document.createElement("canvas");cv.width=Math.max(1,Math.round(vp.width));cv.height=Math.max(1,Math.round(vp.height));
    const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
    return page.render({canvasContext:cx,viewport:vp}).promise.then(()=>{reduzImg(cv.toDataURL("image/jpeg",0.92), ok);});
   })).catch(()=>toast("Não consegui converter esse PDF em imagem.","err"));
  };
  rd.onerror=()=>toast("Não consegui ler esse PDF.","err");
  rd.readAsArrayBuffer(file);
 }).catch(e=>toast((e&&e.message)||"Falha ao carregar o conversor de PDF.","err"));
}

 const gd=e.target.closest("[data-gerardt]");if(gd){gerarDT(gd.dataset.gerardt);return;}

 const vc=e.target.closest("[data-vercapa]");if(vc){openCapa(vc.dataset.vercapa);return;}

 const pcl=e.target.closest("[data-prodcols]");if(pcl){prodCols=parseInt(pcl.dataset.prodcols,10);render();return;}
 const oob=e.target.closest("[data-openobra]");if(oob){const np2=$("#notifpanel");if(np2)np2.classList.remove("on");const ns2=$("#notifscrim");if(ns2)ns2.classList.remove("on");openEditor(oob.dataset.openobra);return;}
 const efx=e.target.closest("[data-editfunc]");if(efx){npEdit=efx.dataset.editfunc;const np=$("#notifpanel");if(!np.classList.contains("on")){np.classList.add("on");$("#notifscrim").classList.add("on");}buildNotifPanel();return;}
 const dfx=e.target.closest("[data-delfunc]");if(dfx){delFuncao(dfx.dataset.delfunc);return;}
 const cc=e.target.closest("[data-capa]");if(cc){openCapa(cc.dataset.capa);return;}
 const op=e.target.closest("[data-open]");if(op){openEditor(op.dataset.open);return;}
 const row=e.target.closest(".row");if(row&&row.dataset.id){openEditor(row.dataset.id);return;}
 const ch=e.target.closest(".chip[data-sel]");if(ch){filt.sel=ch.dataset.sel;render();return;}
 const pr=e.target.closest(".chip[data-pr]");if(pr){fPr.papel=pr.dataset.pr;render();return;}
 if(e.target.id==="prfora"){fPr.fora=!fPr.fora;render();return;}
 if(e.target.id==="addPrest"){openPrestador("__new__");return;}
 const pe=e.target.closest("[data-prest]");if(pe){openPrestador(pe.dataset.prest);return;}
 const prc=e.target.closest(".chip[data-prc]");if(prc){fPr.canal=(fPr.canal===prc.dataset.prc?"all":prc.dataset.prc);render();return;}
 const ano=e.target.closest(".chip[data-ano]");if(ano){fEst.ano=ano.dataset.ano;render();return;}
 if(e.target.id==="fmine"){filt.mine=!filt.mine;render();return;}
 if(e.target.id==="fprio"){filt.prio=!filt.prio;render();return;}
 if(e.target.id==="addBtn"){openCadastro();return;}
 if(e.target.id==="seedbtn"){e.target.textContent="Carregando… aguarde";e.target.disabled=true;seedLive();return;}
 if(e.target.id==="c-save"){const t=$("#c-ori").value.trim()||$("#c-tit").value.trim();if(!t){$("#c-ori").focus();return;}addProd({selo:$("#c-selo").value,titulo:$("#c-tit").value.trim(),original:$("#c-ori").value.trim(),autores:$("#c-aut").value.trim(),colecao:($("#c-col")?$("#c-col").value.trim():""),...(temCol("capa_agente")&&$("#c-ag")?{capa_agente:$("#c-ag").value.trim()}:{}),isbn_fisico:($("#c-isbnf")?$("#c-isbnf").value.trim():""),isbn_digital:($("#c-isbnd")?$("#c-isbnd").value.trim():""),...(temCol("isbn_original")&&$("#c-isbno")?{isbn_original:$("#c-isbno").value.trim()}:{}),...(temCol("paginas")&&$("#c-pag")?{paginas:parseInt($("#c-pag").value,10)||null}:{}),dono:$("#c-dono").value,status:$("#c-st").value,cur:$("#c-cur").value,done:[],obs:$("#c-obs").value.trim(),prioridade:0});closeEditor();tab="prod";render();return;}
 if(e.target.id==="logout"){if(sb)sb.auth.signOut().then(()=>location.reload());return;}
});
function _refoca(id){const el=document.getElementById(id);if(!el)return;const v=el.value;el.focus();
 try{el.setSelectionRange(v.length,v.length)}catch(_){}}
document.body.addEventListener("input",e=>{
 if(e.target.id==="gs-q"){runSearch(e.target.value);return;}
 if(e.target.id==="qpr"){fPr.q=e.target.value;$("#view").innerHTML=viewPrestadores();_refoca("qpr");return;}
 if(e.target.id==="qco"){fCo.q=e.target.value;$("#view").innerHTML=viewColecoes();_refoca("qco");return;}
 if(e.target.id==="q"){filt.q=e.target.value;
 if(tab==="prod"){const el=document.getElementById("prodlist");if(el)el.innerHTML=prodListHTML();return;}
 if(tab==="estoque")$("#view").innerHTML=viewEstoque();else if(tab==="capas")$("#view").innerHTML=viewCapas();else if(tab==="reimp")$("#view").innerHTML=viewReimp();
 const qi=document.getElementById("q");if(qi){const v=qi.value;qi.focus();try{qi.setSelectionRange(v.length,v.length)}catch(_){}}}});
document.body.addEventListener("change",e=>{
 if(e.target.id==="funcsort"){funcSort=e.target.value;$("#view").innerHTML=viewFuncoes();return;}
 const fc=e.target.closest("[data-func]");if(fc){patchFuncao(fc.dataset.func,{status:fc.checked?"feito":"pendente"});render();return;}
 const nc=e.target.closest("[data-notif]");if(nc){patchNotif(nc.dataset.notif,{feito:nc.checked});renderNotif();return;}
 const il=e.target.closest("[data-inline]");if(il){let v=il.value;if(il.dataset.inline==="prioridade")v=parseInt(v,10);patchProd(il.dataset.id,{[il.dataset.inline]:v});const el=document.getElementById("prodlist");if(el)el.innerHTML=prodListHTML();return;}
 const co=e.target.closest("[data-co]");if(co){let v=co.value;if(co.dataset.co==="prioridade")v=parseInt(v,10);if(co.dataset.co==="prazo"&&!v)v=null;patchProd(co.dataset.id,{[co.dataset.co]:v});return;}
 if(e.target.id==="c-selo")fillCurOpts();
 if(e.target.id==="scrim")closeEditor();
});
$("#scrim").onclick=closeEditor;
$("#themebtn").onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("tema",h.dataset.theme)}catch(e){}};

/* boot */
function SEEDPROMPT(){return '<div class="empty" style="text-align:center;padding:56px 20px"><div style="font-family:var(--serif);font-size:20px;margin-bottom:6px">Banco pronto e vazio</div><div class="util" style="font-size:13px;color:var(--muted);margin-bottom:18px">Carregue o catálogo inicial uma vez só. Depois é tudo editável, salvo no banco e com histórico.</div><button class="btn gold" id="seedbtn" style="font-size:14px;padding:12px 20px">Popular catálogo · 66 obras · 223 estoque · 45 reimpressões</button></div>';}
async function seedLive(){
 const chk=await sb.from("producao").select("id",{count:"exact",head:true});
 if(chk&&chk.error){toast("Não consegui verificar o banco. Tente de novo.","err");await loadLive();render();return;}
 if(chk&&chk.count>0){toast("O catálogo já tem "+chk.count+" obras — importação cancelada para não duplicar.","err");await loadLive();render();return;}
 const chunk=(a,n)=>{let o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
 /* o cliente Supabase devolve {data,error} e nao lança: cada lote precisa ser conferido */
 const para=(tab,gravados,err)=>{const m=(err&&(err.message||err.hint))||"erro desconhecido";
  console.error("[painel] seedLive "+tab+":",err);
  $("#view").innerHTML='<div class="empty">A importacao parou em <b>'+esc(tab)+'</b> depois de '+gravados+' registros.<br>'
   +esc(m)+'<br><br>O banco esta parcialmente populado. Nao repita a importacao sem antes limpar a tabela, ou os registros vao duplicar.</div>';};
 let n=0;
 for(const c of chunk(SEED.producao,80)){const r=await sb.from("producao").insert(c.map(x=>({...x,updated_by:meNome()})));
  if(r&&r.error){para("producao",n,r.error);return}n+=c.length;}
 n=0;
 for(const c of chunk(SEED.estoque,150)){const r=await sb.from("estoque").insert(c);
  if(r&&r.error){para("estoque",n,r.error);return}n+=c.length;}
 n=0;
 for(const c of chunk(SEED.reimpressoes,150)){const r=await sb.from("reimpressoes").insert(c);
  if(r&&r.error){para("reimpressoes",n,r.error);return}n+=c.length;}
 await loadLive();render();}
function paintHeader(){$("#whoName").textContent=(MODE==="live"?meNome()+" · "+(role==="coord"?"Coordenação":"Produção"):"Modo demonstração — "+demoUser);
 $("#modeBadge").innerHTML=MODE==="live"?'<span class="livebadge live">● ao vivo</span>':'<span class="livebadge demo">● demo (local)</span>';
 $("#logout").style.display=(MODE==="live"&&user)?"inline-block":"none";}
function fillLogin(){$("#loginlogos").innerHTML=SELOS.map(s=>'<span class="logochip" style="background:'+cfg(s).c+'"><img src="'+cfg(s).logo+'"></span>').join("");
 $("#logincovers").innerHTML=SELOS.concat(SELOS).slice(0,6).map(s=>'<div class="cov" style="background:linear-gradient(160deg,'+cfg(s).c2+','+cfg(s).c+')"></div>').join("");}
function seedDemo(){if(!demoLoad()){prod=SEED.producao.map((p,i)=>({id:uid(),prioridade:0,prazo:null,updated_by:"",...p}));estoque=SEED.estoque.map((e,i)=>({id:uid(),...e}));reimp=(SEED.reimpressoes||[]).map((r,i)=>({id:uid(),...r}));demoSave();}}
async function startLive(){sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);const{data:{session}}=await sb.auth.getSession();
 if(!session){$("#login").classList.add("on");return;}user=session.user;role=(CFG.COORD_EMAILS||[]).includes(user.email)?"coord":"produtora";if(role==="coord")tab="coord";
 await loadLive();
 if(!prodLoadOk){paintHeader();$("#tabs").innerHTML="";$("#view").innerHTML='<div class="empty" style="text-align:center;padding:48px 20px">Não consegui carregar as obras do servidor agora — instabilidade momentânea do banco.<br><br><button class="btn gold" onclick="location.reload()">Tentar de novo</button></div>';return;}
 if(!prod.length){paintHeader();$("#tabs").innerHTML="";$("#view").innerHTML=SEEDPROMPT();return;}
 sb.channel("v2").on("postgres_changes",{event:"*",schema:"public",table:"producao"},async()=>{await loadLive();render();}).subscribe();
 sb.channel("fn").on("postgres_changes",{event:"INSERT",schema:"public",table:"funcoes"},async(payload)=>{
   const nova=payload&&payload.new;
   if(nova&&nova.criado_por===meNome())return;/* já tratado localmente por quem criou */
   await loadExtra();
   renderNotif();renderTabs();
   if(nova){const pref=notifPref();if(pref==="todas"||nova.atribuido_a===meNome())notificarDesktop(nova);}
 }).subscribe();
 sb.channel("fnup").on("postgres_changes",{event:"UPDATE",schema:"public",table:"funcoes"},async(payload)=>{
   const nova=payload&&payload.new;if(!nova)return;
   const antiga=funcoes.find(f=>f.id===nova.id);
   const virouFeita=nova.status==="feito"&&(!antiga||antiga.status!=="feito");
   const quem=nova.updated_by||"";
   await loadExtra();renderNotif();renderTabs();
   if(virouFeita&&quem!==meNome()){const pref=notifPref();if(pref==="todas"||nova.criado_por===meNome())notificarConclusao(nova,quem);}
 }).subscribe();
 pedirPermissaoNotif();
 paintHeader();render();
 try{await checkAutoFuncs();}catch(e){console.error("[painel] auto-funcs:",e);}}
window.addEventListener("DOMContentLoaded",async()=>{
 try{const t=localStorage.getItem("tema");if(t)document.documentElement.dataset.theme=t;}catch(e){}
 fillLogin();
 if(MODE==="live"&&window.supabase){$("#lg-btn").onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$("#lg-email").value.trim(),password:$("#lg-pass").value});if(error)$("#lg-err").textContent="Não deu: "+error.message;else location.reload();};$("#lg-pass").onkeydown=e=>{if(e.key==="Enter")$("#lg-btn").click();};try{await startLive();}catch(e){MODE="demo";seedDemo();paintHeader();render();}}
 else{if(MODE==="live")MODE="demo";seedDemo();paintHeader();render();}
});
</script></body></html>
